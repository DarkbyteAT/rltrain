[project]
name = "rltrain"
version = "2.0.0"
description = "JAX deep reinforcement learning framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ammar Tarajia" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.0",
    "optax>=0.2.0",
    "gymnax>=0.0.8",
    "distreqx>=0.0.1",
    "chex>=0.1.80",
    "gymnasium>=1.0",
    "numpy",
    "matplotlib",
    "seaborn",
    "typer",
]

[project.optional-dependencies]
video = ["moviepy>=2.0"]

[project.urls]
Homepage = "https://github.com/DarkbyteAT/rltrain"
Repository = "https://github.com/DarkbyteAT/rltrain"

[project.scripts]
rltrain = "rltrain.cli:main"

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "ruff",
    "pre-commit",
    "moviepy>=2.0",
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rltrain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
